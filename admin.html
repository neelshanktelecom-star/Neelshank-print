<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEELSHANK - मोबाइल प्रिंट कंट्रोल सेंटर</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulseLive {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.7; }
    }
    .pulse-dot {
      animation: pulseLive 1.6s infinite ease-in-out;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-24 select-none">

  <!-- शीर्ष हेडर (कंट्रोल बार) -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3.5 shadow-xl">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 bg-gradient-to-tr from-indigo-600 to-indigo-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-print text-sm"></i>
        </div>
        <div>
          <h1 class="text-sm font-black tracking-wide text-white">NEELSHANK KIOSK</h1>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 pulse-dot"></span>
            <span class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">लाइव सर्वर कनेक्टेड</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="btn-audio-toggle" onclick="toggleAudio()" class="w-9 h-9 bg-slate-800 border border-slate-700 text-amber-400 rounded-xl flex items-center justify-center text-xs shadow active:scale-95 transition">
          <i id="audio-icon" class="fa-solid fa-bell"></i>
        </button>
        <button onclick="fetchOrders(true)" class="w-9 h-9 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl flex items-center justify-center text-xs shadow-md active:scale-95 transition">
          <i class="fa-solid fa-arrows-rotate" id="refresh-icon"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-3.5 mt-3.5 space-y-3.5">

    <!-- स्टैट्स कार्ड्स (डैशबोर्ड समरी) -->
    <div class="grid grid-cols-3 gap-2.5">
      <div class="glass-card p-3 rounded-2xl shadow-sm text-center border-t-2 border-amber-400">
        <p class="text-[10px] text-slate-400 font-bold uppercase">पेंडिंग प्रिंट</p>
        <p id="stat-pending-count" class="text-xl font-black text-amber-400 mt-0.5">0</p>
      </div>
      <div class="glass-card p-3 rounded-2xl shadow-sm text-center border-t-2 border-emerald-400">
        <p class="text-[10px] text-slate-400 font-bold uppercase">आज की कमाई</p>
        <p id="stat-total-amount" class="text-xl font-black text-emerald-400 mt-0.5">₹0</p>
      </div>
      <div class="glass-card p-3 rounded-2xl shadow-sm text-center border-t-2 border-indigo-400">
        <p class="text-[10px] text-slate-400 font-bold uppercase">प्रिंट संपन्न</p>
        <p id="stat-done-count" class="text-xl font-black text-indigo-400 mt-0.5">0</p>
      </div>
    </div>

    <!-- टैब स्विचर (पेंडिंग vs हिस्ट्री) -->
    <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-bold">
      <button id="tab-btn-pending" onclick="switchView('pending')" class="flex-1 py-2 rounded-lg bg-indigo-600 text-white shadow-sm flex items-center justify-center gap-1.5 transition">
        <i class="fa-solid fa-clock"></i> <span>पेंडिंग कतार (<span id="badge-pending">0</span>)</span>
      </button>
      <button id="tab-btn-history" onclick="switchView('history')" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5 transition">
        <i class="fa-solid fa-clock-rotate-left"></i> <span>इतिहास (History)</span>
      </button>
    </div>

    <!-- ऑर्डर्स कंटेनर -->
    <div id="orders-list-box" class="space-y-3">
      <!-- ऑर्डर्स यहाँ लोड होंगे -->
    </div>

    <!-- खाली स्थिति (Empty State) -->
    <div id="empty-state" class="hidden glass-card py-16 px-4 rounded-3xl text-center space-y-3">
      <div class="w-16 h-16 bg-slate-800/80 text-slate-500 rounded-3xl flex items-center justify-center mx-auto text-2xl shadow-inner border border-slate-700/50">
        <i class="fa-solid fa-inbox"></i>
      </div>
      <div>
        <h3 class="text-sm font-bold text-slate-200">कोई पेंडिंग प्रिंट नहीं है</h3>
        <p class="text-xs text-slate-500 mt-0.5">ग्राहक द्वारा पोर्टल से ऑर्डर सबमिट करते ही यहाँ दिखेगा</p>
      </div>
    </div>

  </main>

  <!-- फुल स्क्रीन इमेज प्रीव्यू मोडल -->
  <div id="modal-preview" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-md p-4 flex flex-col items-center justify-between">
    <div class="w-full flex justify-between items-center text-white py-2">
      <span class="text-xs font-bold text-slate-300">डॉक्यूमेंट HD प्रीव्यू</span>
      <button onclick="closePreviewModal()" class="w-9 h-9 bg-slate-800 text-white rounded-full flex items-center justify-center text-sm active:scale-90">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="flex-1 w-full flex items-center justify-center overflow-hidden my-2">
      <img id="img-modal-target" src="" class="max-w-full max-h-[75vh] object-contain rounded-xl border border-slate-700 shadow-2xl bg-white">
    </div>
    <div class="w-full max-w-sm pb-4">
      <button id="btn-modal-print" onclick="" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black py-3.5 rounded-2xl shadow-xl flex items-center justify-center gap-2">
        <i class="fa-solid fa-print"></i> <span>सीधे प्रिंट करें</span>
      </button>
    </div>
  </div>

  <script>
    const FIREBASE_BASE_URL = "https://neelshank-print-default-rtdb.firebaseio.com/orders";
    let isSoundEnabled = true;
    let currentView = 'pending';
    let knownOrderKeys = new Set();
    let audioContext = null;

    // ऑडियो बीप जनरेटर (नया ऑर्डर आने पर रिंग)
    function playAlertBeep() {
      if (!isSoundEnabled) return;
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioContext.currentTime); // A5
        osc.frequency.exponentialRampToValueAtTime(1320, audioContext.currentTime + 0.15); // E6
        gain.gain.setValueAtTime(0.3, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start();
        osc.stop(audioContext.currentTime + 0.35);
      } catch (e) {
        console.warn("Audio Context blocked", e);
      }
    }

    function toggleAudio() {
      isSoundEnabled = !isSoundEnabled;
      const icon = document.getElementById('audio-icon');
      const btn = document.getElementById('btn-audio-toggle');
      if (isSoundEnabled) {
        icon.className = "fa-solid fa-bell";
        btn.className = "w-9 h-9 bg-slate-800 border border-slate-700 text-amber-400 rounded-xl flex items-center justify-center text-xs shadow active:scale-95 transition";
      } else {
        icon.className = "fa-solid fa-bell-slash";
        btn.className = "w-9 h-9 bg-slate-800 border border-slate-700 text-slate-500 rounded-xl flex items-center justify-center text-xs shadow active:scale-95 transition";
      }
    }

    function switchView(view) {
      currentView = view;
      const btnP = document.getElementById('tab-btn-pending');
      const btnH = document.getElementById('tab-btn-history');
      if (view === 'pending') {
        btnP.className = "flex-1 py-2 rounded-lg bg-indigo-600 text-white shadow-sm flex items-center justify-center gap-1.5 transition";
        btnH.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5 transition";
      } else {
        btnH.className = "flex-1 py-2 rounded-lg bg-indigo-600 text-white shadow-sm flex items-center justify-center gap-1.5 transition";
        btnP.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5 transition";
      }
      fetchOrders();
    }

    async function fetchOrders(animate = false) {
      const refIcon = document.getElementById('refresh-icon');
      if (animate && refIcon) refIcon.classList.add('animate-spin');

      try {
        const response = await fetch(`${FIREBASE_BASE_URL}.json`);
        const data = await response.json() || {};

        let pendingCount = 0;
        let doneCount = 0;
        let totalRevenue = 0;
        let hasNewOrder = false;

        const allKeys = Object.keys(data).reverse();
        const displayList = [];

        allKeys.forEach(k => {
          const item = data[k];
          const isPending = (item.status !== 'DONE');

          if (isPending) {
            pendingCount++;
            if (!knownOrderKeys.has(k)) {
              hasNewOrder = true;
              knownOrderKeys.add(k);
            }
          } else {
            doneCount++;
          }

          totalRevenue += Number(item.amount || 0);

          if (currentView === 'pending' && isPending) {
            displayList.push({ id: k, ...item });
          } else if (currentView === 'history' && !isPending) {
            displayList.push({ id: k, ...item });
          }
        });

        if (hasNewOrder) {
          playAlertBeep();
        }

        // स्टैट्स अपडेट
        document.getElementById('stat-pending-count').innerText = pendingCount;
        document.getElementById('badge-pending').innerText = pendingCount;
        document.getElementById('stat-done-count').innerText = doneCount;
        document.getElementById('stat-total-amount').innerText = `₹${totalRevenue}`;

        renderOrdersList(displayList);

      } catch (err) {
        console.error("Dashboard fetch error:", err);
      } finally {
        if (animate && refIcon) {
          setTimeout(() => refIcon.classList.remove('animate-spin'), 600);
        }
      }
    }

    function renderOrdersList(items) {
      const container = document.getElementById('orders-list-box');
      const emptyState = document.getElementById('empty-state');

      container.innerHTML = '';

      if (items.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      items.forEach(order => {
        const card = document.createElement('div');
        card.className = "glass-card p-3.5 rounded-2xl shadow-lg border border-slate-800 space-y-3 transition transform active:scale-[0.99]";

        const isPending = (order.status !== 'DONE');
        const badgeColor = isPending ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' : 'bg-slate-700/40 text-slate-400 border-slate-700';

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-black px-2.5 py-0.5 rounded-full border ${badgeColor}">
              ${order.doc_type || 'दस्तावेज़'}
            </span>
            <div class="text-right">
              <span class="text-sm font-black text-emerald-400">₹${order.amount || 10}</span>
              <span class="text-[10px] text-slate-400 block -mt-0.5 font-bold">${order.color_mode || 'B&W'}</span>
            </div>
          </div>

          <div class="flex items-center gap-3 bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80">
            <div onclick="openPreviewModal('${order.id}', '${order.image_data}')" class="relative cursor-pointer group">
              <img src="${order.image_data}" class="w-16 h-20 object-cover rounded-lg border border-slate-700 bg-white shadow-sm">
              <span class="absolute inset-0 bg-black/40 rounded-lg flex items-center justify-center text-white opacity-0 group-hover:opacity-100 transition text-xs">
                <i class="fa-solid fa-magnifying-glass-plus"></i>
              </span>
            </div>

            <div class="flex-1 text-xs space-y-1">
              <div class="flex justify-between">
                <span class="text-slate-400">कॉपियां:</span>
                <span class="font-black text-indigo-300">${order.copies || 1} प्रिंट</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400">समय:</span>
                <span class="font-bold text-slate-300">${order.time || 'अभी'}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400">Txn/Ref:</span>
                <span class="font-mono text-[10px] text-amber-400 font-bold truncate max-w-[120px]">${order.ref_id || order.id.slice(-6)}</span>
              </div>
            </div>
          </div>

          <div class="flex gap-2 pt-0.5">
            ${isPending ? `
              <button onclick="directMobilePrint('${order.id}', '${order.image_data}')" class="flex-1 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 active:scale-95 text-slate-950 font-black py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-lg shadow-emerald-500/20">
                <i class="fa-solid fa-print text-sm"></i>
                <span>प्रिंट करें (Print Now)</span>
              </button>
              <button onclick="markOrderCompleted('${order.id}')" class="w-24 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 font-bold py-2.5 rounded-xl text-xs border border-slate-700">
                पूर्ण (Done)
              </button>
            ` : `
              <button onclick="directMobilePrint('${order.id}', '${order.image_data}')" class="flex-1 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 border border-slate-700">
                <i class="fa-solid fa-arrow-rotate-left"></i>
                <span>दोबारा प्रिंट करें</span>
              </button>
            `}
          </div>
        `;

        container.appendChild(card);
      });
    }

    // मोबाइल डायरेक्ट प्रिंटर कमांड
    function directMobilePrint(orderId, base64Image) {
      const printWindow = window.open('', '_blank');
      if (!printWindow) {
        alert("कृपया ब्राउज़र सेटिंग्स में Pop-up Permissions 'Allow' करें!");
        return;
      }

      printWindow.document.write(`
        <!DOCTYPE html>
        <html>
          <head>
            <title>NEELSHANK Print</title>
            <style>
              @page { size: A4 portrait; margin: 0; }
              body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: flex-start; background: #fff; }
              img { width: 100%; height: auto; max-height: 100vh; object-fit: contain; }
            </style>
          </head>
          <body>
            <img src="${base64Image}" onload="window.print(); window.close();" />
          </body>
        </html>
      `);
      printWindow.document.close();

      // प्रिंट होने पर ऑटो-आर्काइव
      markOrderCompleted(orderId);
    }

    async function markOrderCompleted(orderId) {
      try {
        await fetch(`${FIREBASE_BASE_URL}/${orderId}.json`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'DONE', completed_at: new Date().toLocaleTimeString('en-IN') })
        });
        fetchOrders();
      } catch (e) {
        console.error("Mark completed error:", e);
      }
    }

    function openPreviewModal(orderId, imgData) {
      document.getElementById('img-modal-target').src = imgData;
      const printBtn = document.getElementById('btn-modal-print');
      printBtn.onclick = () => {
        closePreviewModal();
        directMobilePrint(orderId, imgData);
      };
      document.getElementById('modal-preview').classList.remove('hidden');
    }

    function closePreviewModal() {
      document.getElementById('modal-preview').classList.add('hidden');
    }

    // ऑटो-पोलिंग (हर 4 सेकंड में नया ऑर्डर फेच)
    setInterval(() => fetchOrders(false), 4000);
    window.addEventListener('DOMContentLoaded', () => fetchOrders(true));
  </script>
</body>
</html>
